{% assign research_items = site.research | sort: 'order' %}
<div class="research-showcase">
{% for item in research_items %}
  <article class="research-row research-row--{{ item.slug }}" aria-labelledby="theme-{{ item.slug }}">
    <div class="research-copy"><p class="eyebrow"><span class="research-number">0{{ item.order }}</span> {{ item.kicker }}</p><h3 id="theme-{{ item.slug }}"><a href="{{ item.url | relative_url }}">{{ item.title | escape }}</a></h3><p>{{ item.summary }}</p><a class="text-link" href="{{ item.url | relative_url }}">Explore this research <span aria-hidden="true">→</span></a></div>
    {% include figure.html item=item %}
  </article>
{% endfor %}
</div>
