    width: 1367
    height: 1131
    alt: Two semiconductor field plots of electric potential with separate voltage scales.
    caption: Computed electric-potential fields in the coupled electro-gradient semiconductor formulation.
  presentation: paired
pinn-microbender:
  title: Physics-informed neural networks with data-driven in modeling and characterizing piezoelectric
    micro-bender
  year: 2024
  status: Journal of Micromechanics and Microengineering 34, 115004
  publication_id: pinn-microbender
  themes:
