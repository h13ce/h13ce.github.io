ferro-difffem:
  title: 'Differentiable finite elements for history-dependent ferroelectricity: matrix-free forward
    analysis and adjoint inverse identification'
  year: 2026
  status: Preprint and submitted manuscript
  publication_id: ferro-difffem
  themes:
  - ferroelectric-mems
  - scientific-ml
  summary: A differentiable finite-element framework for nonlinear ferroelectric MEMS that keeps
    the local switching problem, global electromechanical equilibrium, and loading history inside
    one forward/inverse model. The formulation combines implicit differentiation, matrix-free nonlinear
    solution, and a fully discrete adjoint for trajectory-based parameter identification.
  source_figure:
    repository: h13ce/ERCStg
    path: Figures/difffem_mirror.pdf
  presentation: text
ferro-microactuator:
  title: Simplified phenomenological model for ferroelectric micro-actuator
  year: 2023
  status: Micromachines 14, 1355
  publication_id: ferro-microactuator
  themes:
  - ferroelectric-mems
  summary: A thermodynamically based phenomenological model connects ferroelectric switching to coupled
    finite-element actuator simulation and device-scale characterization. The associated micro-cantilever
    work links the material description to LDV measurements and ferroelectric thin-film characterization.
