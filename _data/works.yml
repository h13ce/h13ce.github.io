  presentation: paired
fno-homogenization:
  title: Universal Fourier Neural Operators for periodic homogenization problems in linear elasticity
  year: 2026
  status: Journal of the Mechanics and Physics of Solids 206, 106418
  publication_id: fno-homogenization
  themes:
  - scientific-ml
  - multiscale-mechanics
  summary: Fourier neural operators are connected directly to FFT-based computational homogenization,
    showing how an FNO can reproduce the basic FFT scheme and approximate periodic cell problems
    while retaining a clear computational- mechanics interpretation.
  source_figure:
    repository: h13ce/ERCStg
    path: Figures/FNO_FFT_fiber.png
  presentation: text
stochastic-symmetry:
  title: Symmetries in stochastic homogenization and adjustments for the RVE method
  year: 2026
  status: International Journal of Solids and Structures 325, 113728
  publication_id: stochastic-symmetry
  themes:
  - multiscale-mechanics
  summary: Statistical symmetries of random microstructures are used to constrain effective response
    and fluctuations, with orthogonal symmetry projection providing a principled variance-reduction
    mechanism for RVE calculations.
  source_figure:
    repository: h13ce/ERCStg
    path: Figures/Isotropic_RVEs.png
  presentation: text
