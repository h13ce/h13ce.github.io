afe-actuator:
  title: Computational modeling of uniaxial antiferroelectric and antiferroelectric-like actuators
  year: 2024
  status: International Journal of Numerical Modelling 37, e3273
  publication_id: afe-actuator
  themes:
  - ferroelectric-mems
  summary: The ferroelectric modelling line is extended to antiferroelectric and antiferroelectric-like
    switching, translating pinched and double P-E hysteresis into a practical constitutive update
    and coupled actuator model.
  source_figure:
    repository: h13ce/ERCStg
    path: Figures/AFE-AFE-like.png
  figure:
    path: /assets/images/works/afe-actuator.webp
    width: 1382
    height: 1055
    alt: Experimental and simulated strain and electric-displacement hysteresis, polarization response,
      and actuator displacement curves.
    caption: Constitutive response and actuator displacement for antiferroelectric and antiferroelectric-like
      materials.
  presentation: wide
ferro-fno:
  title: Fourier neural operator-based modeling of ferroelectric device under large signal and high
    frequency
  year: 2026
  status: Public preprint
  publication_id: ferro-fno
  themes:
  - ferroelectric-mems
  - scientific-ml
  summary: Experimentally measured voltage-displacement trajectories across amplitudes and frequencies
    are used to train a Fourier neural operator for nonlinear ferroelectric micro-actuation, extending
    operator learning toward large-signal excitation, high frequency, and structural resonance.
  source_figure:
    repository: h13ce/ERCStg
    path: Figures/Butterflies_Exp_FNO.png
  presentation: text
flexo-sin:
  title: Observation of flexoelectric effect in PECVD silicon nitride
  year: 2025
  status: Applied Physics Letters 126
  publication_id: flexo-sin
  themes:
  - flexoelectric-mems
  summary: A complete fabrication-experiment-computation chain for extracting a weak flexoelectric
    response from PECVD silicon nitride, combining device microfabrication, controlled bending, lock-in
    charge measurement, and finite-element interpretation.
  source_figure:
    repository: h13ce/ERCStg
    path: Figures/Flexo_works.png
  presentation: text
electro-gradient-semiconductor:
  title: NURBS-based formulation for nonlinear electro-gradient elasticity in semiconductors
  year: 2019
  status: Computer Methods in Applied Mechanics and Engineering 346, 1074-1095
  publication_id: electro-gradient-semiconductor
  themes:
  - flexoelectric-mems
  summary: A higher-order isogeometric formulation couples flexoelectricity, electro-gradient elasticity,
    and free-charge transport in semiconducting materials. This work forms part of the numerical-method
    foundation for later multiphysics and experimental MEMS studies.
  source_figure:
    repository: h13ce/ERCStg
    path: Figures/Flexo_semiconductor.png
  figure:
