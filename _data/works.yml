bistable-topological:
  title: Topologically switchable behavior induced by an elastic instability in a phononic waveguide
  year: 2020
  status: Journal of Applied Physics 127, 245109
  publication_id: bistable-topological
  themes:
  - topological-phononics
  summary: An elastically bistable unit cell provides two mechanically stable configurations with
    different topological states, linking local structural switching to collective wave-guiding behaviour.
  source_figure:
    repository: h13ce/ERCStg
    path: CV/cv_TI_bistable.svg
  presentation: text
