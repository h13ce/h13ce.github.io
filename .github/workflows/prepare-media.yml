name: Validate research portfolio
on:
  push:
    branches: [visual-pass-2-media]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with GitHub Pages dependencies
        run: JEKYLL_ENV=production bundle exec jekyll build --strict_front_matter
      - name: Check references and scientific media
        run: |
          python -m pip install PyYAML
          python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          path: _site/
          retention-days: 2
