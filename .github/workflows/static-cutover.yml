name: One-shot static cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/static-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current homepage source
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build current site
        run: JEKYLL_ENV=production bundle exec jekyll build --strict_front_matter

      - name: Validate current build
        run: |
          python -m pip install --quiet PyYAML
          python scripts/check_site.py

      - name: Replace repository tree with static output
        run: |
          mkdir -p /tmp/homepage-site
          cp -a _site/. /tmp/homepage-site/
          git rm -rf .
          cp -a /tmp/homepage-site/. .
          touch .nojekyll
          git add -A

      - name: Commit static deployment snapshot
        run: |
          git config user.name "homepage-cutover"
          git config user.email "79328632+h13ce@users.noreply.github.com"
          git commit -m "Convert h13ce.github.io to static deployment output"
          git push origin main
